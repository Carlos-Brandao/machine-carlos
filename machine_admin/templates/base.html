<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Machine Admin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">Machine Admin</a>
    <nav>
      <a href="/admin/jobs">Jobs</a>
      <a href="/admin/datasets">Bases</a>
      <a href="/admin/credentials">Credenciais</a>
      {% if user.role == 'admin' %}
      <a href="/admin/users">Usuários</a>
      <a href="/admin/tokens">Tokens</a>
      <a href="/admin/secrets">Segredos</a>
      {% endif %}
    </nav>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <button class="ghost" type="submit">Sair</button>
    </form>
  </header>
  {% endif %}
  <main class="container {% if not user %}narrow{% endif %}">
    {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
