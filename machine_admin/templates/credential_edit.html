{% extends "base.html" %}
{% block content %}
<div class="page-title"><div><p class="eyebrow">Portais</p><h1>Editar credencial</h1></div><a class="button ghost" href="/admin/credentials">Voltar</a></div>
<section class="card"><p class="muted">{{ municipality.platform.name if municipality and municipality.platform else '-' }} · {{ municipality.name if municipality else credential.municipality_slug }}</p><form method="post" class="stack"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>Identificação<input name="label" value="{{ credential.label }}" required></label><label>Usuário do portal<input name="username" autocomplete="off" placeholder="Deixe vazio para manter"></label><label>Senha do portal<input type="password" name="password" autocomplete="new-password" placeholder="Deixe vazio para manter"></label><label>Consignatária<input name="consignataria" value="{{ credential.consignataria }}" required></label><button type="submit">Salvar alterações</button></form></section>
{% endblock %}
